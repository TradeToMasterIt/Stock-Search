name: "Cloud Auto-Scanner & Algo Runner"

on:
  schedule:
    # Runs every 15 minutes during Indian Market Hours (09:15 to 15:30 IST)
    # 03:45 UTC to 10:00 UTC, Monday to Friday
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan even if market is closed'
        required: false
        type: boolean
        default: false

concurrency:
  group: cloud-scanner
  cancel-in-progress: false

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Cloud Market Scan & Algo Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FORCE_MODE: ${{ inputs.force }}
        run: |
          if [ "$FORCE_MODE" = "true" ]; then
            python run_cloud_scan.py --force
          else
            python run_cloud_scan.py
          fi

      - name: Persist Trades & Alert State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add algo_trades.json algo_config.json alert_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: Sync algo state and trades from cloud scan [skip ci]"
            git push origin main
          else
            echo "No state changes to commit."
          fi
